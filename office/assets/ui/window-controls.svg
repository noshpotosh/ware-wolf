<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32"
  shape-rendering="crispEdges">
  <!-- minimize dash -->
  <rect x="10" y="14" width="12" height="3" fill="#f4efe6"/>
  <!-- maximize square -->
  <rect x="42" y="9" width="12" height="12" fill="none"
    stroke="#f4efe6" stroke-width="2"/>
  <!-- close X -->
  <rect x="74" y="10" width="2" height="2" fill="#f4efe6"
    transform="rotate(45 75 11)"/>
  <g fill="#f4efe6" transform="translate(72,8)">
    <rect x="0" y="0" width="3" height="3"/>
    <rect x="3" y="3" width="3" height="3"/>
    <rect x="6" y="6" width="3" height="3"/>
    <rect x="9" y="9" width="3" height="3"/>
    <rect x="12" y="12" width="3" height="3"/>
    <rect x="12" y="0" width="3" height="3"/>
    <rect x="9" y="3" width="3" height="3"/>
    <rect x="3" y="9" width="3" height="3"/>
    <rect x="0" y="12" width="3" height="3"/>
  </g>
</svg>
